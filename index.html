<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戀與深空 卡池年曆</title>
<style>
:root{
  --bg:#fbf9fe;--card:#fff;--ink:#4a4458;--sub:#7a7391;--line:#ece6f6;--accent:#7b5ea7;--today:#ff5c8a;
  --n-混池:#c9b6f2;--n-月卡:#a8d1f7;--n-日卡:#b5e3bf;--n-生日:#ffe08a;--n-自選:#d3d8dc;
  --r-混池:#e7defa;--r-月卡:#d6e8fb;--r-日卡:#daf2e0;--r-生日:#fff0c6;--r-自選:#edeff1;
  --n-劇情:#ffcba4;--r-劇情:#ffe6d3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;font-size:14px}
header{padding:14px 18px 6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:20px;margin:0;color:var(--accent);flex:1 1 auto}
.today-badge{background:#fff;border:2px solid var(--today);color:var(--today);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 18px}
button,select,input{font:inherit;color:var(--ink)}
button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
button:hover{background:#f3eefc}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0}
.title{font-size:18px;font-weight:700;min-width:120px;text-align:center}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 18px 8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer;border:1px solid transparent;user-select:none}
.chip.off{opacity:.35;text-decoration:line-through}
.chip.ghost{background:#fff;border:1px dashed var(--sub);color:var(--sub)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;padding:6px 18px 24px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:4px 0}
.dow div:first-child,.dow div:last-child{color:#a06a8e}
.cell{min-height:92px;border:1px solid var(--line);margin:-0.5px;padding:3px;background:#fff;cursor:pointer;position:relative;overflow:hidden}
.cell.out{background:#fbf9fe;opacity:.55}
.cell.sel{outline:2px solid var(--accent);z-index:1}
.cell.today{box-shadow:inset 0 0 0 2px var(--today);background:#fff5f8}
.dn{font-size:12px;font-weight:700;color:var(--sub)}
.cell.today .dn{color:var(--today)}
.ev{display:block;font-size:11px;line-height:1.25;border-radius:5px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ev.pred{border:1.5px dashed #8d86a3;background:#fff !important}
.ev.pv{background:#ffe3ea !important;color:#b3294f;font-weight:700;text-decoration:none}
a.ev.pv{cursor:pointer}
.more{font-size:10px;color:var(--sub);margin-top:2px}
@media(max-width:640px){.cell{min-height:58px}.ev{font-size:0;height:7px;padding:0;border-radius:4px}.more{font-size:9px}}
.side h3{margin:0 0 6px;font-size:14px;color:var(--accent)}
.side section{margin-bottom:14px}
.item{display:flex;gap:6px;align-items:flex-start;margin:5px 0;font-size:13px;line-height:1.4}
.item .bd{min-width:0}
.sw{flex:0 0 12px;height:12px;border-radius:4px;margin-top:3px}
.sw.pred{border:1.5px dashed #8d86a3;background:#fff}
.muted{color:var(--sub);font-size:12px}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:0 6px;margin-left:4px;background:#f1ecfa;color:var(--accent)}
.tag.live{background:#ffe3ea;color:#b3294f}
.tag.pvok{background:#e3f6ea;color:#2e8b57}
.tag.pred{background:#fff;border:1px dashed var(--sub);color:var(--sub)}
a.pvl{color:#b3294f;font-weight:700;text-decoration:none}
a.pvl:hover{text-decoration:underline}
a.pvb{display:inline-block;margin:2px 4px 0 0;padding:1px 8px;border-radius:999px;background:#ffe3ea;color:#b3294f;font-size:12px;font-weight:700;text-decoration:none}
a.pvb:hover{background:#ffd0dc}
a.pvb.s{background:#f1ecfa;color:var(--accent)}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mini{border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;background:#fff}
.mini h4{margin:0 0 4px;font-size:13px;text-align:center}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.md{aspect-ratio:1;font-size:9px;display:flex;align-items:center;justify-content:center;border-radius:3px;color:var(--ink);position:relative}
.md.today{outline:2px solid var(--today);z-index:1}
.md.pv::after{content:"";position:absolute;right:1px;top:1px;width:4px;height:4px;border-radius:50%;background:#e53935}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:700;position:sticky;top:0;background:#fff}
tr.cur td{background:#fff5f8}
dialog{border:1px solid var(--line);border-radius:14px;max-width:420px;width:92%}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:var(--sub)}
dialog input,dialog select{width:100%;padding:5px;border:1px solid var(--line);border-radius:8px}
#adminTools{display:contents}#adminTools[hidden]{display:none}
.adm{font-size:12px;background:#fff3cd;color:#8a6d00;border:1px solid #ffe69c;border-radius:999px;padding:3px 10px}
.mini-btn{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid #ffe69c;background:#fff;color:#8a6d00;cursor:pointer}
.lock{background:none;border:none;font-size:12px;opacity:.35;cursor:pointer;padding:0 4px}.lock:hover{opacity:1}
#loginDlg{max-width:320px}#loginDlg label{display:block;margin:8px 0 2px;font-size:12px;color:var(--sub)}#loginDlg input{width:100%;padding:6px;border:1px solid var(--line);border-radius:8px}
footer{padding:0 18px 20px;color:var(--sub);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>戀與深空　卡池年曆</h1>
  <span class="today-badge" id="todayBadge"></span>
</header>

<div class="bar">
  <button id="prev" aria-label="上一個">◀</button>
  <span class="title" id="title"></span>
  <button id="next" aria-label="下一個">▶</button>
  <button id="goToday">回到今天</button>
  <span class="seg" id="views">
    <button data-v="month" class="on">月</button><button data-v="year">年</button><button data-v="list">清單</button>
  </span>
  <span id="adminTools" hidden>
    <button id="addBtn">＋ 新增／補 PV</button>
    <button id="reload">重新載入資料</button>
    <button id="pick">選取 pools.json</button><input type="file" id="file" accept=".json,application/json" hidden>
    <span class="adm">管理模式 <button type="button" id="exitAdmin" class="mini-btn">登出</button> <button type="button" id="pwBtn" class="mini-btn">改密碼</button></span>
  </span>
</div>
<div class="filters" id="filters"></div>

<div class="layout">
  <main class="card" id="main"></main>
  <aside class="card side" id="side"></aside>
</div>

<footer><span id="foot"></span> <button type="button" id="lockBtn" class="lock" title="管理員登入" aria-label="管理員登入">🔒</button></footer>
<dialog id="loginDlg">
  <form method="dialog" id="loginForm">
    <b>管理員登入</b>
    <label for="loginPw">密碼</label><input id="loginPw" type="password" autocomplete="current-password">
    <div id="loginMsg" class="muted" aria-live="polite" style="min-height:18px;margin-top:6px"></div>
    <div style="display:flex;gap:8px;margin-top:8px;justify-content:flex-end"><button type="button" id="loginCancel">取消</button><button id="loginOk" class="on" value="ok">登入</button></div>
  </form>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="form">
    <b>新增卡池／補 PV（只存在這個瀏覽器）</b>
    <label>卡池名稱</label><input name="name" required>
    <label>類型</label>
    <select name="kind"><option>混池</option><option>月卡</option><option>日卡</option><option>生日</option><option>自選</option><option>劇情</option></select>
    <label>角色（混池可留空）</label><input name="chars">
    <label><input type="checkbox" name="rerun" style="width:auto"> 復刻</label>
    <label>開池日</label><input type="date" name="start" required>
    <label>截止日</label><input type="date" name="end" required>
    <label>PV 首播日（選填）</label><input type="date" name="pv">
    <label>PV 時間（選填，如 11:00）</label><input name="pvTime">
    <label>PV 影片網址（選填，多支用空白或換行分隔）</label><input name="pvUrl">
    <label><input type="checkbox" name="pred" style="width:auto"> 這是預測</label>
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
      <button type="button" id="exportBtn">匯出我新增的 JSON</button>
      <button type="button" id="cancel">取消</button>
      <button id="save" value="ok" class="on">儲存</button>
    </div>
  </form>
</dialog>

  var f=document.getElementById("filters");f.textContent="";
  KINDS.forEach(function(k){
    var c=el("span","chip"+(state.kinds[k]?"":" off"),NAME[k]);c.style.background="var(--n-"+k+")";
    c.onclick=function(){state.kinds[k]=!state.kinds[k];render()};f.appendChild(c)});
  [["新卡","新卡"],["復刻","↻復刻"],["預測","預測"],["其他PV","其他PV"]].forEach(function(x){
    var c=el("span","chip ghost"+(state.show[x[0]]?"":" off"),x[1]);
    c.onclick=function(){state.show[x[0]]=!state.show[x[0]];render()};f.appendChild(c)});
  f.appendChild(el("span","muted","　▶＝PV 首播日（點粉紅條開影片；同日多支請點右側面板）　橘色＝劇情／免費五星活動　粉框＝今天　虛線＝預測"));
}

function renderMonth(list){
  var main=document.getElementById("main");main.textContent="";
  var dow=el("div","dow");WD.forEach(function(w){dow.appendChild(el("div",null,w))});main.appendChild(dow);
  var g=el("div","grid");main.appendChild(g);
  var first=new Date(state.y,state.m,1);var start=new Date(first);start.setDate(1-first.getDay());
  var rows=Math.ceil((first.getDay()+new Date(state.y,state.m+1,0).getDate())/7);
  for(var i=0;i<rows*7;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);var s=ymd(d);
    var c=el("div","cell"+(d.getMonth()!==state.m?" out":"")+(s===T?" today":"")+(s===state.sel?" sel":""));
    c.appendChild(el("div","dn",String(d.getDate())));
    var act=onDay(list,s),pvs=pvOn(list,s),vids=vidsOn(s),n=pvs.length+vids.length;
    if(n){
      var e;
      if(n===1){
        if(pvs.length){
          var p=pvs[0],u=pvUrls(p);
          if(u.length>=1) e=mkLink("▶ PV "+p.name+(u.length>1?" ＋"+(u.length-1):""),u[0],"ev pv","開啟官方 PV：「"+p.name+"」"+(p.pvTime?"（首播 "+p.pvTime+"）":"")+(u.length>1?"　另有 "+(u.length-1)+" 支，見右側面板":""));
          else{e=el("span","ev pv","▶ PV "+p.name+" 🔍");e.title="尚無影片連結，點選後在右側面板搜尋"}
        }else{var v0=vids[0];e=mkLink("▶ "+shortTitle(v0.title),v0.url,"ev pv",v0.title)}
      }else{e=el("span","ev pv","▶ PV ×"+n);e.title="同日有 "+n+" 支 PV，點選後在右側面板開啟"}
      c.appendChild(e);
    }
    var room=3-(n?1:0);
    act.slice(0,room).forEach(function(p){
      var e=el("span","ev"+(p.pred?" pred":""),label(p));e.style.background=bg(p);e.title=p.name+"　"+md(p.start)+"–"+md(p.end);c.appendChild(e)});
    if(act.length>room) c.appendChild(el("div","more","+"+(act.length-room)));
    (function(s){c.onclick=function(ev){state.sel=s;render();if(ev.target&&ev.target.classList&&ev.target.classList.contains("pv")&&window.innerWidth<=900){var sd=document.getElementById("side");if(sd&&sd.scrollIntoView)sd.scrollIntoView({behavior:"smooth"})}}})(s);
    g.appendChild(c);
  }
}

function renderYear(list){
  var main=document.getElementById("main");main.textContent="";
  var yr=el("div","year");main.appendChild(yr);
  for(var m=0;m<12;m++){
    var box=el("div","mini");box.appendChild(el("h4",null,(m+1)+" 月"));
    var g=el("div","mg");
    var first=new Date(state.y,m,1);
    for(var k=0;k<first.getDay();k++) g.appendChild(el("div","md"));
    var n=new Date(state.y,m+1,0).getDate();
    for(var d=1;d<=n;d++){
      var s=state.y+"-"+pad(m+1)+"-"+pad(d);var act=onDay(list,s);
      var c=el("div","md"+(s===T?" today":"")+((pvOn(list,s).length||vidsOn(s).length)?" pv":""),String(d));
      if(act.length){c.style.background=bg(act[0]);if(act[0].pred)c.style.outline="1px dashed #8d86a3"}
      g.appendChild(c)}
    box.appendChild(g);
    (function(m){box.onclick=function(){state.m=m;state.view="month";render()}})(m);
    yr.appendChild(box)}
}

function renderList(list){
  var main=document.getElementById("main");main.textContent="";
  var yl=list.filter(function(p){return p.start.slice(0,4)==String(state.y)||p.end.slice(0,4)==String(state.y)})
    .sort(function(a,b){return a.start.localeCompare(b.start)||a.rerun-b.rerun});
  var t=el("table");var h=el("tr");["開池","截止","卡池","類型","角色","PV 首播","PV 連結","狀態"].forEach(function(x){h.appendChild(el("th",null,x))});t.appendChild(h);
  yl.forEach(function(p){
    var r=el("tr",(T>=p.start&&T<=p.end&&!p.pred)?"cur":"");
    var nm=el("td");var sw=el("span","sw"+(p.pred?" pred":""));sw.style.display="inline-block";sw.style.marginRight="4px";sw.style.background=p.pred?"#fff":bg(p);nm.appendChild(sw);
    nm.appendChild(document.createTextNode((p.rerun?"↻ ":"")+p.name+(p.pending?"（待確認）":"")));
    var st=status(p);
    r.appendChild(el("td",null,md(p.start)));r.appendChild(el("td",null,md(p.end)+(p.endEstimated?"？":"")));r.appendChild(nm);
    r.appendChild(el("td",null,NAME[p.kind]));r.appendChild(el("td",null,p.chars||"—"));
    r.appendChild(el("td",null,p.pv?md(p.pv)+(p.pvTime?" "+p.pvTime:""):"—"));
    var lk=el("td");if(p.pred){lk.appendChild(document.createTextNode("—"))}else{lk.appendChild(pvLinks(p))}r.appendChild(lk);
    var s=el("td");s.appendChild(el("span","tag "+st.c,st.t));r.appendChild(s);t.appendChild(r)});
  main.appendChild(t);
  var vl=allVids().filter(function(v){return v.date.slice(0,4)===String(state.y)}).sort(function(a,b){return (a.date+(a.time||"")).localeCompare(b.date+(b.time||""))});
  if(vl.length){
    main.appendChild(el("h3",null,state.y+" 年　其他官方 PV（"+vl.length+" 支）"));
    var t2=el("table"),h2=el("tr");["首播","類別","標題","連結"].forEach(function(x){h2.appendChild(el("th",null,x))});t2.appendChild(h2);
    vl.forEach(function(v){
      var r=el("tr");r.appendChild(el("td",null,md(v.date)+(v.time?" "+v.time:"")));r.appendChild(el("td",null,v.cat||"其他"));
      r.appendChild(el("td",null,v.title));var lk=el("td");lk.appendChild(mkLink("▶ PV",v.url,"pvb","開啟官方 PV（YouTube）"));r.appendChild(lk);t2.appendChild(r)});
    main.appendChild(t2);
  }
}

function item(p,extra){
  var d=el("div","item");var sw=el("span","sw"+(p.pred?" pred":""));if(!p.pred)sw.style.background=bg(p);d.appendChild(sw);
  var b=el("div","bd");var st=status(p);
  var l=el("div");l.appendChild(el("b",null,(p.rerun?"↻ ":"")+p.name));l.appendChild(el("span","tag",NAME[p.kind]));
  if(p.pending)l.appendChild(el("span","tag pred","待確認"));
  var pvs=pvStatus(p);if(pvs)l.appendChild(el("span","tag "+pvs.c,pvs.t));
  b.appendChild(l);
  b.appendChild(el("div","muted",(p.chars?p.chars+"　":"")+md(p.start)+"–"+md(p.end)+(p.endEstimated?"（結束日推估）":"")+"　"+st.t+(p.pv?"　PV "+md(p.pv)+(p.pvTime?" "+p.pvTime:""):"")+((p.pvCn&&p.pvCn!==p.pv)?"（簡中服 "+md(p.pvCn)+"）":"")));
  if(!p.pred&&(p.pv||pvUrls(p).length)){var w=el("div");w.appendChild(pvLinks(p));b.appendChild(w)}
  if(p.note)b.appendChild(el("div","muted",p.note));
  if(extra&&p.extra){var x=el("button",null,"刪除");x.onclick=function(){var a=extras().filter(function(e){return e.id!==p.id});saveExtras(a);render()};b.appendChild(x)}
  d.appendChild(b);return d;
}

function pvRow(prefix,p,suffix){
  var d=el("div","item");var b=el("div","bd");
  b.appendChild(document.createTextNode(prefix+p.name+(suffix||"")+"　"));
  b.appendChild(pvLinks(p));d.appendChild(b);return d;
}

function vidRow(prefix,v){
  var d=el("div","item");var b=el("div","bd");
  b.appendChild(document.createTextNode(prefix+shortTitle(v.title)+"　"));
  b.appendChild(mkLink("▶ PV",v.url,"pvb s",v.title));d.appendChild(b);return d;
}
function renderSide(list){
  var s=document.getElementById("side");s.textContent="";
  var all=allPools();
  var sec=el("section");sec.appendChild(el("h3",null,"今天　"+fmtFull(T)));
  var now=onDay(all.filter(function(p){return !p.pred}),T);
  if(!now.length) sec.appendChild(el("div","muted","目前沒有限定五星池"));
  now.forEach(function(p){sec.appendChild(item(p))});
  pvOn(all,T).forEach(function(p){sec.appendChild(pvRow("▶ 今天首播：",p))});
  vidsOn(T).forEach(function(v){sec.appendChild(vidRow("▶ 今天首播：",v))});
  s.appendChild(sec);

  var up=all.filter(function(p){return p.start>T}).sort(function(a,b){return a.start.localeCompare(b.start)}).slice(0,4);
  var sec2=el("section");sec2.appendChild(el("h3",null,"接下來"));
  if(!up.length) sec2.appendChild(el("div","muted","資料中沒有後續排期"));
  up.forEach(function(p){sec2.appendChild(item(p))});s.appendChild(sec2);

  var evs=all.filter(function(p){return p.pv&&!p.pred}).map(function(p){return {d:p.pv,t:p.pvTime||"",p:p}})
    .concat(allVids().map(function(v){return {d:v.date,t:v.time||"",v:v}}));
  evs.sort(function(a,b){return (b.d+b.t).localeCompare(a.d+a.t)});
  var pub=evs.filter(function(e){return e.d<=T}).slice(0,5),sch=evs.filter(function(e){return e.d>T}).reverse();
  var sec3=el("section");sec3.appendChild(el("h3",null,"PV 動態"));
  function row(e,pre){return e.p?pvRow(pre,e.p,e.p.rerun?"（復刻）":""):vidRow(pre,e.v)}
  sch.forEach(function(e){sec3.appendChild(row(e,"⏳ "+md(e.d)+" 預定　"))});
  pub.forEach(function(e){sec3.appendChild(row(e,"▶ "+md(e.d)+(e.t?" "+e.t:"")+"　"))});
  s.appendChild(sec3);

  var sec4=el("section");sec4.appendChild(el("h3",null,"選取日　"+fmtFull(state.sel)));
  var sel=onDay(all,state.sel);if(!sel.length)sec4.appendChild(el("div","muted","這天沒有限定五星池"));
  sel.forEach(function(p){sec4.appendChild(item(p,true))});
  pvOn(all,state.sel).forEach(function(p){sec4.appendChild(pvRow("▶ PV 首播"+(p.pvTime?" "+p.pvTime:"")+"：",p))});
  vidsOn(state.sel).forEach(function(v){sec4.appendChild(vidRow("▶ "+(v.time?v.time+" ":"")+"["+(v.cat||"其他")+"] ",v))});
  s.appendChild(sec4);
}

function render(){
  T=todayStr();
  document.getElementById("todayBadge").textContent="今天 "+fmtFull(T);
  var list=visible();
  document.getElementById("title").textContent=state.view==="month"?state.y+" 年 "+(state.m+1)+" 月":state.y+" 年";
  Array.prototype.forEach.call(document.querySelectorAll("#views button"),function(x){x.classList.toggle("on",x.dataset.v===state.view)});
  renderFilters();
  if(state.view==="month")renderMonth(list);else if(state.view==="year")renderYear(list);else renderList(list);
  renderSide(list);
  document.getElementById("foot").textContent=
    "資料來源："+state.source+"（資料更新日 "+state.updated+"）。日期慣例：開池日 05:00 更新後～截止日 04:59。▶ 只標示已查證的 PV 首播日；預測依歷史間隔推算，非官方排期，預測開池日一過或官方資料出現同類池即自動隱藏。";
}

/* ============ 導覽 ============ */
function step(n){
  if(state.view==="month"){var d=new Date(state.y,state.m+n,1);state.y=d.getFullYear();state.m=d.getMonth()}
  else state.y+=n;
  render();
}
document.getElementById("prev").onclick=function(){step(-1)};
document.getElementById("next").onclick=function(){step(1)};
document.getElementById("goToday").onclick=function(){var d=new Date();state.y=d.getFullYear();state.m=d.getMonth();state.sel=todayStr();render()};
Array.prototype.forEach.call(document.querySelectorAll("#views button"),function(x){x.onclick=function(){state.view=x.dataset.v;render()}});

/* ============ 新增／補 PV ============ */
var dlg=document.getElementById("dlg"),form=document.getElementById("form");
if(ADMIN){document.getElementById("adminTools").hidden=false;}
else{dlg.parentNode.removeChild(dlg);}
if(ADMIN){
document.getElementById("addBtn").onclick=function(){form.reset();if(typeof dlg.showModal==="function")dlg.showModal();else dlg.setAttribute("open","")};
document.getElementById("cancel").onclick=function(){dlg.close?dlg.close():dlg.removeAttribute("open")};
document.getElementById("save").onclick=function(e){
  e.preventDefault();
  if(!form.reportValidity())return;
  var f=new FormData(form);
  var urls=(f.get("pvUrl")||"").split(/\s+/).filter(function(x){return /^https?:\/\//i.test(x)});
  var o={name:f.get("name"),kind:f.get("kind"),chars:f.get("chars")||"",rerun:!!f.get("rerun"),
    start:f.get("start"),end:f.get("end"),pv:f.get("pv")||null,pvTime:f.get("pvTime")||null,pred:!!f.get("pred")};
  if(urls.length){o.pvUrl=urls[0];if(urls.length>1)o.pvUrls=urls}
  if(o.end<o.start){alert("截止日不能早於開池日");return}
  o.id="x-"+Date.now();var a=extras();a.push(o);saveExtras(a);
  dlg.close?dlg.close():dlg.removeAttribute("open");render();
};
document.getElementById("exportBtn").onclick=function(){
  var blob=new Blob([JSON.stringify({updated:T,pools:extras()},null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my_pools.json";a.click();
};
}

/* ============ 登入／登出／改密碼 ============ */
(function(){
  var lockBtn=document.getElementById("lockBtn"),dlgL=document.getElementById("loginDlg"),pw=document.getElementById("loginPw"),msg=document.getElementById("loginMsg");
  var fails=0,lockedUntil=0;
  function openL(){pw.value="";msg.textContent="";if(typeof dlgL.showModal==="function")dlgL.showModal();else dlgL.setAttribute("open","");setTimeout(function(){pw.focus()},30)}
  function closeL(){dlgL.close?dlgL.close():dlgL.removeAttribute("open")}
  if(ADMIN){lockBtn.style.display="none";document.getElementById("loginDlg").parentNode.removeChild(dlgL)}
  else{
    lockBtn.onclick=openL;
    document.getElementById("loginCancel").onclick=closeL;
    document.getElementById("loginOk").onclick=function(e){
      e.preventDefault();
      var now=Date.now();
      if(now<lockedUntil){msg.textContent="請稍候 "+Math.ceil((lockedUntil-now)/1000)+" 秒再試";return}
      if(pwHash(pw.value)===ADMIN_HASH){
        try{localStorage.setItem(ADMIN_KEY,ADMIN_HASH)}catch(x){}
        location.reload();
      }else{
        fails++;lockedUntil=now+Math.min(30000,fails*2000);msg.textContent="密碼不正確";pw.value="";pw.focus();
      }
    };
  }
  var ex=document.getElementById("exitAdmin");
  if(ex)ex.onclick=function(){try{localStorage.removeItem(ADMIN_KEY)}catch(x){}location.reload()};
  var pb=document.getElementById("pwBtn");
  if(pb)pb.onclick=function(){
    var a=prompt("輸入新密碼（至少 8 碼，不要用你在別處用過的密碼）：");
    if(a===null)return;
    if(a.length<8){alert("至少 8 碼");return}
    var line='var ADMIN_HASH="'+pwHash(a)+'";';
    try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(line).catch(function(){})}catch(x){}
    prompt("已產生新的雜湊（已嘗試複製）。到 GitHub 編輯 index.html，把 var ADMIN_HASH=... 那一行換成下面這行，存檔後生效：",line);
  };
})();

/* ============ 載入資料（線上 JSON 優先，失敗用內建） ============ */
function load(){
  if(!window.fetch||location.protocol==="file:"){state.source="內建資料（以檔案方式開啟，無法自動更新）";render();return}
  fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
  .then(function(j){if(!j||!Array.isArray(j.pools))throw new Error("format");
    applyData(j);state.updated=j.updated||"未標示";state.source="線上 "+DATA_URL;render()})
  .catch(function(err){state.source=state.source.replace(/（.*$/,"")+"（自動讀取 "+DATA_URL+" 失敗"+(ADMIN?"："+((err&&err.message)||err)+"。可按「選取 pools.json」手動更新":"，目前顯示內建資料")+"）";render()});
}
if(ADMIN){
document.getElementById("reload").onclick=load;
document.getElementById("pick").onclick=function(){document.getElementById("file").click()};
document.getElementById("file").onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result);if(!j||!Array.isArray(j.pools))throw new Error("格式不符");
    applyData(j);state.updated=j.updated||"未標示";state.source="手動選取的 "+f.name+"（存在這個瀏覽器）";
    try{localStorage.setItem(BASE_KEY,JSON.stringify(j))}catch(e){}render()}catch(e){alert("讀取失敗："+e.message)}};
  r.readAsText(f,"utf-8");this.value="";
};
}
load();
setInterval(load,REFRESH_MS);

/* ============ 跟著系統日期：跨日自動更新 ============ */
setInterval(function(){if(todayStr()!==T){var d=new Date();if(state.sel===T)state.sel=todayStr();state.y=d.getFullYear();state.m=d.getMonth();render()}},60*1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&todayStr()!==T)render()});
})();

<script>

(function(){

if(!tools||tools.hidden)return;

/* ---------- UI ---------- */

function sayLink(t,href){msg.textContent=t+" ";var a=mk("a",null,"查看執行紀錄");a.href=href;a.target="_blank";a.rel="noopener noreferrer";msg.appendChild(a);msg.style.color="#b3294f"}

/* ---------- Token 設定視窗 ---------- */
var dlg=mk("dialog");dlg.id="tokenDlg";dlg.style.cssText="max-width:460px;width:92%;border:1px solid #ece6f6;border-radius:14px";
dlg.innerHTML='<form method="dialog"><b>GitHub Token（只存在這個瀏覽器）</b>'
 +'<p style="font-size:12px;color:#7a7391;line-height:1.6;margin:8px 0">建立方式：GitHub 右上頭像 → Settings → Developer settings → Personal access tokens → <b>Fine-grained tokens</b> → Generate new token。<br>'
 +'① Repository access 選 <b>Only select repositories</b>，只勾這個倉庫；<br>② Repository permissions → <b>Actions</b> 選 <b>Read and write</b>（其他都不要給）；<br>③ 到期日建議 90 天。產生後把 Token 貼在下面。</p>'
 +'<input id="tokenInput" type="password" autocomplete="off" placeholder="github_pat_…" style="width:100%;padding:6px;border:1px solid #ece6f6;border-radius:8px">'
 +'<div id="tokenStat" style="font-size:12px;color:#7a7391;margin-top:6px"></div>'
 +'<div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end"><button type="button" id="tokenClear">清除 Token</button><button type="button" id="tokenCancel">取消</button><button id="tokenSave" value="ok" style="background:#7b5ea7;color:#fff">儲存</button></div></form>';
document.body.appendChild(dlg);

/* ---------- GitHub API ---------- */
function api(path,method,body){
  var h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+tok(),"X-GitHub-Api-Version":"2022-11-28"};
  if(body)h["Content-Type"]="application/json";
  return fetch(API+path,{method:method||"GET",headers:h,body:body?JSON.stringify(body):undefined,cache:"no-store"});
}
var REPO="/repos/"+CFG.owner+"/"+CFG.repo;
async function listRuns(all){
  var r=await api(REPO+(all?"/actions/runs?per_page=20":"/actions/workflows/"+CFG.workflow+"/runs?event=workflow_dispatch&per_page=10"));
  if(!r.ok)throw {status:r.status};
  return (await r.json()).workflow_runs||[];
}
function explain(st){
  if(st===401)return "Token 無效或已過期，請按「Token」重新設定";
  if(st===403)return "Token 權限不足（需要 Actions: Read and write），或 GitHub 暫時限流";
  if(st===404)return "找不到倉庫或工作流程，或這組 Token 沒有授權這個倉庫";
  if(st===422)return "工作流程沒有開放手動觸發（update.yml 需有 workflow_dispatch）";
  return "GitHub 回應 "+st;
}

/* ---------- pools.json 前後比較 ---------- */
async function snap(){
  try{var r=await fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)return null;var j=await r.json();
    var links=0;(j.pools||[]).forEach(function(p){var n=(p.pvUrls&&p.pvUrls.length)||(p.pvUrl?1:0);links+=n});
    return {raw:JSON.stringify(j),pools:(j.pools||[]).length,links:links,story:(j.pools||[]).filter(function(p){return p.kind==="劇情"}).length,pvs:(j.pvs||[]).length,pending:(j.pools||[]).filter(function(p){return p.pending}).length};
  }catch(e){return null}
}
function diffText(a,b){
  if(!a||!b)return "已重新載入資料";
  if(a.raw===b.raw)return "沒有新的 PV 或活動";
  var t=[];
  if(b.links>a.links)t.push("新增 PV 連結 "+(b.links-a.links)+" 個");
  if(b.pvs>a.pvs)t.push("其他 PV "+(b.pvs-a.pvs)+" 支");
  if(b.story>a.story)t.push("劇情活動 "+(b.story-a.story)+" 個");
  if(b.pools>a.pools+0&&b.pools-a.pools-(b.story-a.story)>0)t.push("新卡池 "+(b.pools-a.pools-(b.story-a.story))+" 個（待確認）");
  return t.length?t.join("、"):"資料有更新（日期或欄位調整）";
}

/* ---------- 主流程 ---------- */
var busy=false;
btn.onclick=async function(){
  if(busy)return;
  if(!tok()){openCfg();return}
  busy=true;btn.disabled=true;
  var t0=Date.now();
  var tick=setInterval(function(){if(msg.dataset.base)say(msg.dataset.base+"（"+Math.round((Date.now()-t0)/1000)+" 秒）")},1000);
  function phase(t){msg.dataset.base=t;say(t+"（"+Math.round((Date.now()-t0)/1000)+" 秒）")}
  try{
    phase("準備中");
    var before=await snap();
    var known=(await listRuns(false)).map(function(r){return r.id});
    var knownAll=(await listRuns(true)).map(function(r){return r.id});
    var rr=await api(REPO);if(!rr.ok)throw {status:rr.status};
    var branch=(await rr.json()).default_branch||"main";

    phase("已送出檢查要求");
    var d=await api(REPO+"/actions/workflows/"+CFG.workflow+"/dispatches","POST",{ref:branch});
    if(d.status!==204)throw {status:d.status};

    var run=null;
    for(var i=0;i<20&&!run;i++){await sleep(3000);
      run=(await listRuns(false)).filter(function(r){return known.indexOf(r.id)<0})[0]||null;
      phase("等待工作流程啟動")}
    if(!run)throw {text:"超過 1 分鐘仍沒看到工作流程啟動，請到 Actions 頁面確認"};

    phase("正在抓取官方影片");
    for(var k=0;k<60;k++){
      var rs=await listRuns(false);var cur=rs.filter(function(r){return r.id===run.id})[0];
      if(cur&&cur.status==="completed"){run=cur;break}
      await sleep(5000);phase("正在抓取官方影片")}
    if(run.status!=="completed")throw {text:"超過 5 分鐘仍未完成，請到 Actions 頁面查看"};
    if(run.conclusion!=="success"){sayLink("檢查失敗（"+run.conclusion+"）",run.html_url);return}

    phase("抓取完成，等待網站更新");
    var pages=null;
    for(var j=0;j<8&&!pages;j++){await sleep(4000);
      pages=(await listRuns(true)).filter(function(r){return knownAll.indexOf(r.id)<0&&/pages build/i.test(r.name||"")})[0]||null}
    if(pages){
      for(var q=0;q<40;q++){
        var all=await listRuns(true);var pc=all.filter(function(r){return r.id===pages.id})[0];
        if(pc&&pc.status==="completed")break;
        await sleep(5000);phase("網站部署中")}
    }
    await sleep(1500);
    var after=await snap();
    if(reload)reload.click();
    say("完成 "+new Date().toLocaleTimeString("zh-TW",{hour12:false})+"，"+diffText(before,after)+(pages?"":"（本次沒有新提交）"),true);
  }catch(e){
    if(e&&e.status)say(explain(e.status),false);
    else if(e&&e.text)say(e.text,false);
    else say("檢查中斷："+((e&&e.message)||e),false);
  }finally{clearInterval(tick);msg.dataset.base="";busy=false;btn.disabled=false}
};
})();
</script>

  var posts=(FEED&&FEED.posts)||[];
  if(!FEED){
    list.appendChild(mk("div","wb-empty",location.protocol==="file:"?"以檔案方式開啟時無法讀取微博公告。":(ERR==="404"?"尚未產生微博公告資料（排程執行後會出現）。":"目前讀不到微博公告資料。")));
    return;
  }
  if(FEED.updated)stat.textContent="最近一次有新內容："+FEED.updated.slice(0,16).replace("T"," ");
  if(FEED.verdict&&FEED.verdict!=="OK"){
    warn.hidden=false;
    warn.textContent="微博目前無法自動讀取"+(posts.length?"，以下是最後一次取得的內容。":"，所以還沒有公告可顯示。")
      +(isAdmin()?"（技術原因："+FEED.verdict+(FEED.why?"，"+FEED.why:"")+"）":"");
  }
  TAGS.forEach(function(t){
    var n=t==="全部"?posts.length:posts.filter(function(p){return p.tag===t}).length;
    var b=mk("button","wb-chip"+(t===TAG?" on":""),t+"（"+n+"）");b.type="button";
    b.onclick=function(){TAG=t;N=STEP;draw()};chips.appendChild(b)});
  if(posts.some(function(p){return pics(p).length})){
    var tg=mk("button","wb-chip img"+(imgOn()?" on":""),"🖼 圖片："+(imgOn()?"開":"關"));tg.type="button";
    tg.setAttribute("aria-pressed",imgOn()?"true":"false");tg.onclick=function(){setImg(!imgOn());draw()};chips.appendChild(tg);
  }
  var rows=posts.filter(function(p){return TAG==="全部"||p.tag===TAG});
  if(!rows.length){list.appendChild(mk("div","wb-empty",posts.length?"這個分類目前沒有公告。":"目前沒有微博公告資料。"));return}
  rows.slice(0,N).forEach(function(p){
    var it=mk("div","wb-item"),meta=mk("div","wb-meta");
    meta.appendChild(document.createTextNode(when(p.time)));meta.appendChild(mk("span","wb-tag "+tagCls(p.tag),p.tag));
    it.appendChild(meta);it.appendChild(mk("div","wb-text",p.text));
    var th=thumbs(p);if(th)it.appendChild(th);
    var act=mk("div","wb-act");
    if(okUrl(p.url)){var a=mk("a",null,"開啟微博 ↗");a.href=p.url;act.appendChild(openNew(a))}
    (p.periods||[]).slice(0,2).forEach(function(r){
      if(!r.start)return;var b=mk("button",null,"📅 "+md(r.start)+(r.end?"–"+md(r.end):" 起")+" 在日曆上看");b.type="button";
      b.onclick=function(){jump(r.start)};act.appendChild(b)});
    it.appendChild(act);list.appendChild(it)});
  if(rows.length>N){more.hidden=false;more.textContent="顯示更多（還有 "+(rows.length-N)+" 則）";more.onclick=function(){N+=STEP;draw()}}
}

/* ---------- 載入 ---------- */
function load(){
  if(!window.fetch||location.protocol==="file:"){FEED=null;draw();return}
  fetch(DATA+"?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(String(r.status));return r.json()})
  .then(function(j){if(!j||!Array.isArray(j.posts))throw new Error("format");FEED=j;ERR="";draw()})
  .catch(function(e){FEED=null;ERR=(e&&e.message)||"";draw()});
}
load();setInterval(function(){if(!lb||lb.hidden)load()},REFRESH);   // 放大檢視中不重繪，避免圖片被中斷
var rl=document.getElementById("reload");if(rl)rl.addEventListener("click",load);
})();
</script>
